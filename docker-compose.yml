name: node-express-app-starter
services:
  mongo:
    image: mongo:latest
    container_name: node-express-app-starter-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./tmp/db/mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

  mailhog:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - 1051:1025
      - 8051:8025

  sonarqube:
     image: sonarqube:community
     ports:
        - '9003:9000'
     environment:
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
      - SONARQUBE_JDBC_URL=jdbc:postgresql://node-express-app-starter-postgres:5432/sonar

  postgres:
      container_name: node-express-app-starter-postgres
      image: postgres:latest
      volumes:
        - ./tmp/db/postgresql:/var/lib/postgresql/data
      environment:
        - POSTGRES_PASSWORD=postgresPasswword
        - POSTGRES_USER=nodeProdUser
        - POSTGRES_DB=nest_starter
      ports:
        - '5433:5432'
